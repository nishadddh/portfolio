<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calculator {
            width: 380px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
        }
        h2 { text-align: center; margin-bottom: 25px; color: #222; }
        .input-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        input:focus { border-color: #333; }
        .result { margin-top: 25px; }
        .result-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        .result-box span:first-child { font-weight: bold; color: #555; }
        .result-box span:last-child {
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }
        .final-price { background: #222; color: white; }
        .final-price span { color: white !important; }
        .clear-btn {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #e5e5e5;
            color: #222;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .clear-btn:hover { background: #d5d5d5; }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Discount Calculator</h2>

        <div class="input-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Enter amount" min="0" step="0.01">
        </div>

        <div class="input-group">
            <label for="discount">Discount (%)</label>
            <input type="number" id="discount" placeholder="Enter discount percentage" min="0" max="100" step="0.01">
        </div>

        <div class="result">
            <div class="result-box">
                <span>Discount Amount</span>
                <span id="discountAmount">0.00</span>
            </div>
            <div class="result-box final-price">
                <span>Final Price</span>
                <span id="finalPrice">0.00</span>
            </div>
        </div>

        <button class="clear-btn" id="clearBtn">Clear</button>
    </div>

    <script>
        const amountInput = document.getElementById("amount");
        const discountInput = document.getElementById("discount");
        const discountAmount = document.getElementById("discountAmount");
        const finalPrice = document.getElementById("finalPrice");
        const clearBtn = document.getElementById("clearBtn");

        function calculateDiscount() {
            let amount = parseFloat(amountInput.value) || 0;
            let discount = parseFloat(discountInput.value) || 0;

            if (amount < 0) amount = 0;
            if (discount < 0) discount = 0;
            if (discount > 100) discount = 100;

            const discountValue = (amount * discount) / 100;
            const finalValue = amount - discountValue;

            discountAmount.textContent = discountValue.toFixed(2);
            finalPrice.textContent = finalValue.toFixed(2);
        }

        amountInput.addEventListener("input", calculateDiscount);
        discountInput.addEventListener("input", calculateDiscount);

        clearBtn.addEventListener("click", function () {
            amountInput.value = "";
            discountInput.value = "";
            discountAmount.textContent = "0.00";
            finalPrice.textContent = "0.00";
            amountInput.focus();
        });
    </script>
</body>
</html>
