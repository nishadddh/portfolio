<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #24292e;
            color: white;
            border-radius: 8px;
        }
        
        h1 {
            margin-bottom: 10px;
        }
        
        .profile {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .profile img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid white;
        }
        
        .repos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .repo-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .repo-card:hover {
            transform: translateY(-5px);
        }
        
        .repo-card h3 {
            color: #0366d6;
            margin-bottom: 10px;
        }
        
        .repo-card p {
            color: #586069;
            margin-bottom: 15px;
        }
        
        .repo-stats {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }
        
        .repo-stats span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        a {
            color: inherit;
            text-decoration: none;
        }
        
        a.button {
            display: inline-block;
            padding: 8px 16px;
            background-color: #0366d6;
            color: white;
            border-radius: 4px;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        
        a.button:hover {
            background-color: #0056b3;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #586069;
        }
        
        @media (max-width: 768px) {
            .repos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="profile">
            <img id="avatar" src="" alt="Profile Picture">
            <div>
                <h1 id="username">GitHub Portfolio</h1>
                <p id="bio"></p>
            </div>
        </div>
    </header>
    
    <main>
        <h2 style="text-align: center; margin-bottom: 20px;">My Repositories</h2>
        <div class="repos" id="repos-container">
            <!-- Repositories will be loaded here -->
        </div>
    </main>
    
    <footer>
        <p>Last updated: <span id="update-date"></span></p>
    </footer>

    <script>
        // GitHub username
        const username = "nishadddh";
        
        // Fetch user profile data
        fetch(`https://api.github.com/users/${username}`)
            .then(response => response.json())
            .then(user => {
                document.getElementById('username').textContent = user.name || user.login;
                document.getElementById('bio').textContent = user.bio || 'GitHub enthusiast';
                document.getElementById('avatar').src = user.avatar_url;
            });
        
        // Fetch repositories
        fetch(`https://api.github.com/users/${username}/repos?sort=updated&direction=desc`)
            .then(response => response.json())
            .then(repos => {
                const reposContainer = document.getElementById('repos-container');
                
                repos.forEach(repo => {
                    if (!repo.fork) { // Skip forked repositories
                        const repoCard = document.createElement('div');
                        repoCard.className = 'repo-card';
                        
                        repoCard.innerHTML = `
                            <h3><a href="${repo.html_url}" target="_blank">${repo.name}</a></h3>
                            <p>${repo.description || 'No description provided'}</p>
                            <div class="repo-stats">
                                <span>⭐ ${repo.stargazers_count}</span>
                                <span>🍴 ${repo.forks_count}</span>
                                <span>📝 ${repo.language || 'N/A'}</span>
                            </div>
                            <a href="${repo.html_url}" class="button" target="_blank">View on GitHub</a>
                            ${repo.homepage ? `<a href="${repo.homepage}" class="button" target="_blank">Live Demo</a>` : ''}
                        `;
                        
                        reposContainer.appendChild(repoCard);
                    }
                });
                
                // Update last updated date
                document.getElementById('update-date').textContent = new Date().toLocaleDateString();
            })
            .catch(error => {
                console.error('Error fetching GitHub data:', error);
                document.getElementById('repos-container').innerHTML = `
                    <p style="grid-column: 1/-1; text-align: center;">
                        Could not load repositories. Please check your internet connection or try again later.
                    </p>
                `;
            });
    </script>
</body>
</html>
